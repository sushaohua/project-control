title: 核实并修复部署调用结束或会话断开后守护进程退出的问题（对应用户“问题 4”，根因待查）。
objective: '【问题】核实并修复部署调用结束或会话断开后守护进程退出的问题（对应用户“问题 4”，根因待查）。


  用户报告：部署脚本退出后四个守护进程同时终止，怀疑未充分隔离 SIGHUP、标准输入和 shell 作业管理；建议统一使用 `nohup`、`< /dev/null`
  和 `disown`。


  当前只读观察：`tools/deploy_twin.sh` 以 `--nofork` 后台启动 `dbus-daemon`，该启动行没有 `nohup`；forward、device_manager
  和 ui-gateway 已使用 `nohup`，但启动行未显式重定向标准输入，脚本没有 `disown`。这些是代码事实，尚不能证明“非交互 shell 正常退出必然杀死全部子进程”。


  处理要求：在实际调用方式下区分正常脚本退出、终端/SSH 断开、SIGHUP、父级超时或进程组/cgroup 清理，保存进程树、退出/信号和服务日志。按实际原因选择最小可靠方案；`nohup`、标准输入解绑、作业表处理或已有受控服务管理方式按适用性采用，不把三种
  shell 写法机械拼接当作充分修复。不得用忽略错误掩盖服务已启动失败。


  验收目标：在约定的部署调用结束和会话断开场景中，四个服务按冻结的生命周期要求存活，D-Bus 和 HTTP/公开健康检查有效；PID/运行记录指向实际进程，显式停止后不遗留占用，重复部署可正确收敛。父级主动销毁整个受控执行环境的场景与普通
  shell 退出分开声明，不能声称 nohup/disown 可抵抗所有回收。'
