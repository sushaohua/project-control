  verbatim_instruction: '【问题】核实并修复 GCC 15 下 test_backoff.cpp 的未初始化警告导致全栈构建阻断（对应用户“问题
    2”，根因待查）。


    用户报告：全栈编译停在 `build 1/5 runtime`，`runtime/build/tests/test_backoff.cpp` 的局部变量传入防御性断言时触发
    `-Werror=maybe-uninitialized`。建议将 `backoff_state_t st;`、`backoff_config_t cfg;`
    改为显式零初始化。


    当前只读观察：`test_backoff_null_guards()` 中上述两个声明仍未初始化，相关 CMake 目标启用了 `-Werror`；助理未在
    GCC 15 下复现告警。实现的空指针卫语句与编译器诊断分别核实，不把告警直接表述成已发生的运行期未初始化读取。


    处理要求：记录实际 GCC 版本、完整编译参数和原始错误；确认后在必要位置采用最小初始化修复，保留空指针防御测试及严格告警策略，不以关闭告警或删除断言通过构建。


    验收目标：同一 GCC 15 构建条件下消除该阻断，相关 backoff 测试的防御、递增、上限和重置行为保持正确；记录实际执行范围及结果，不把只通过 runtime
    目标写成全栈已通过。'
  common_constraints:
  - 来源：用户在助理会话中要求确认下列三个可能问题是否存在并修复，随后明确要求放入收件入口，供 COORD 自动取得。三条指令主分类均为“问题 / issue”；编号、分类
    YAML、正式任务关联由既有收件流程查重生成。
  - 本单是人工要求的整理稿，不是缺陷已复现、修复完成或 QA 通过的证明。用户提供的根因和修复方法作为调查线索；已修复项核实版本及证据后复用，不重复修改。
  - 只读观察基线：当前工作区 `soc-ap` 的 `main`，HEAD `7c1f35091850b39f4ba3ff9b242043a62f3e5b74`；管理仓观察
    HEAD `491158cd4f183a01517c36fb093821db54a8a6dd`。执行前重新锁定服务器准确候选。
  - 用户报告中的 `/home/sushaohua/tmp/ai_soc_project/` 与当前 `/home/sushaohua/workspace/ai_soc_project/`
    不同，须核对源码、构建制品及实际加载库的版本，不默认两处相同。
  - 由唯一 COORD 查重收件、关联正式任务并更新 Board；INTEGRATOR 汇总编译部署问题，DDS 依赖问题交 ENG-DDS，职责或技术冲突由
    ARCH 补充裁定。COORD 不代改业务源码。
  - 沿用有效授权及简化 QA，避免无关重构。确认的修复应可从干净服务器检出复现；第三方补丁必须版本化并纳入构建，不能只修改 Git 忽略的安装目录。
  - 当前只有一台 VMware 和一套物理台架；本单不授权抢占台架、停止现有任务、烧录、运动或加热。构建与进程生命周期验证安排到明确窗口；本单三项软件修复不默认增加整机
    HIL。
  - 本次助理仅整理任务并只读核查，未编译、未启动服务、未执行测试，也未修改业务代码。
