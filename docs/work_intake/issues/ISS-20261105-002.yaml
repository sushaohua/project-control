title: 核实 Fast-CDR optional 复制/移动语义与 Fast-DDS 启动崩溃的关系，并使必要修复可随干净构建复现（对应用户“问题 3”，根因待查）。
objective: '【问题】核实 Fast-CDR optional 复制/移动语义与 Fast-DDS 启动崩溃的关系，并使必要修复可随干净构建复现（对应用户“问题
  3”，根因待查）。


  用户报告：`forward_service_daemon`、`device_manager_daemon` 启动发生 SIGSEGV / 退出码 139；GDB
  栈涉及 `PublicationBuiltinTopicData` 复制构造和 `std::string::_M_construct`。报告将其归因于 Fast-CDR
  2.2.5 的 `optional<T>` 在源对象未赋值时仍构造 union 内对象，建议在复制/移动构造中检查 `val.storage_.engaged_`，重编
  Fast-CDR、Fast-DDS。用户另报告修补后有 `ALL 6 FAST DDS TEST SUITES PASSED` 输出，此结论须取得原始命令、逐项结果和版本绑定后核实。


  当前只读观察：

  - 本工作区 `third_party/src/Fast-CDR-2.2.5/include/fastcdr/xcdr/optional.hpp` 与 `third_party/install/include/fastcdr/xcdr/optional.hpp`
  已包含所述条件守卫，不能把本地头文件重复描述为仍未修补。

  - 仓库 `third_party/archives/Fast-CDR-2.2.5.tar.gz` 内的同名头文件仍无上述守卫，复制/移动构造无条件构造内部对象；压缩包头文件与安装头文件不同。

  - `third_party/src/`、`build/`、`install/` 均被 Git 忽略，当前构建脚本从压缩包展开源码，未观察到此修补的版本化应用步骤。须核实本地修补来源及干净重建的实际结果。


  处理要求：先核对崩溃现场、编译器/ABI、实际加载的 Fast-CDR/Fast-DDS 库及符号，不仅凭栈顶字符串构造就锁定唯一根因。确认 optional
  缺陷后，采用可追溯的最小补丁或已接受的依赖修订方案；保留原始归档来源和校验信息，明确补丁应用位置、幂等性及失败处理。重建受头文件影响的 Fast-CDR、Fast-DDS
  和相关 AP 消费者，避免新旧头文件/库/二进制混用。


  验收目标：干净检出和重新解包能够自动得到相同修复；覆盖未赋值/已赋值对象的复制、移动及相关生命周期行为；相关 DDS 跨进程通信与两个守护进程的启动健康验证通过。以真实测试条目、退出码及日志证明结果，不将一行汇总文本当作全套测试证明。'
