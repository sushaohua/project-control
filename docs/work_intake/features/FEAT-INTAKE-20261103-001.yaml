title: 三类人工入口自动调度第一阶段（手动单步 → 持续推进与恢复 → 定时调度）
objective: >
  人工提交一批自然语言指令或 MD，按“一条指令对应一条稳定需求”形成理解与实施概要，绑定人工对准确版本的批准后，
  由程序自动生成唯一主分类 YAML、编号与正式任务卡关联，由唯一 COORD 基于 /home/sushaohua/.local/bin/codex exec -m gpt-6-luna
  按 M1 手动单步 → M2 持续推进与恢复 → M3 定时调度分段实现并独立 QA 验收。
