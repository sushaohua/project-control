title: test_harness 自动化部署工具分块恢复 512B 默认值与说明书勘误
objective: '【问题描述】

  TH Bootloader 原型能力集 `capability_flags = 0xE0080423`（`Bits 16..23 = 0x08` 代表 512B
  最大分块，宏定义 `CHUNK_MAX_SIZE = 512U`）。但在实测部署脚本中被写死为 `blk_size = 64`，造成 76,896 字节固件被切分为
  1,202 包，交互频繁。


  【处置要求】

  1. 派单给 `INTEGRATOR`，更新 `test_harness/hil/tools/hil_deploy_via_minimc_ota.py`，将分块大小默认值调整为契约标准的
  512 字节（约 150 包）。

  2. 在 `project-control/docs/guides/minimc_v2_mcu_upgrade_and_hil_deployment_manual_20261105.md`
  中勘误相关位图注释描述。'
