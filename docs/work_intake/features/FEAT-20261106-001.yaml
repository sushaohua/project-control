title: mcu-p3 级联中继超时时间戳无符号下溢修复
objective: '【问题描述】

  在 `mcu-p3/motion-controller-mcu/project/src/minimc_proto.c` 的 `check_th_relay_timeout(uint32_t
  now_ms)` 函数中：

  ```c

  const uint32_t elapsed = (uint32_t)(now_ms - s_relay_start_ms);

  if (elapsed < s_relay_timeout_ms) { return; }

  s_relay_pending = false;

  ```

  由于 `now_ms` 是在 `minimc_proto_poll()` 主循环入口统一采样，而中继发包时 `s_relay_start_ms = wk_timebase_get()`
  在随后的 `drain_ap_rx()` 中更新。若主循环处理期间系统毫秒计数刚好增加 1ms，导致 `now_ms < s_relay_start_ms`，32
  位无符号减法发生下溢变成 `4,294,967,295`。

  这导致 MC 在发包后的同一个主循环内瞬间误判超时，将 `s_relay_pending` 置为 `false`。当 TH 在数十毫秒内正常返回 ACK 时，MC
  因 `!s_relay_pending` 判定其为非法帧（`BAD_FRAME 0x07`）并丢弃，迫使 AP 等待 1.2s 超时重传。


  【处置要求】

  1. 派单给 `ENG-MC`，对 `check_th_relay_timeout` 的时钟差计算加入防下溢保护（例如在调用或函数内直接采样最新 `wk_timebase_get()`，或增加正向时间卫语句）。

  2. 在 `mcu-p3` 中补充相关时间戳翻转与采样倒流的单测/模拟测试。

  3. 经独立 Docker 构建与独立 Codex QA 审阅通过后合入。'
