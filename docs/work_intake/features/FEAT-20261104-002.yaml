  verbatim_instruction: 'VMware/AP↔MC 业务 UART 统一至921600。

    参考需求确认单 project-control/docs/planning/vmware_mc_921600_requirement_confirmation_20261103.md，将
    VMware/AP 与 MC 之间的业务串口默认及运行波特率由 115200 统一调整为 921600 8N1 无流控，不修改 Bootloader，并在两项功能交付后按四项已确认
    QA 选择开展合并验收。'
  common_constraints:
  - '{''新任务显式 qa_policy'': ''streamlined-v1；未迁移旧任务继续 legacy，按切换记录逐卡处理。特殊变更的必要审查及真实
    HIL 要求保留''}'
  - 读取交接文档所引用的两份需求确认单。概要说明范围、角色分工、依赖、兼容/回退和验收方法；数值及已确认目标不重复询问。概要确认后再安排业务实现
  - 沿用已确认的四项 QA 选择：使用现有 VMware并安排独占窗口/冻结快照；两项功能交付后首次完整验收；已有 MC/TH及完整台架；自动生成制品和烧录计划，由授权人员确认并烧录，再自动测试
  - 工程实现、作者自检和集成按角色委派。正式 QA 使用真实独立 Codex 会话，普通子 Agent 不能代替。遵守 COORD 代码写入边界，不代写业务代码，不扩大到
    Bootloader或未授权硬件操作
  - 根仓和管理仓沿用 main，不默认另建专项分支；其他仓遵守各自规定分支。保留他人改动，只提交授权范围内成果
