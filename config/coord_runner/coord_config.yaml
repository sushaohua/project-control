schema_version: 1

runner:
  workspace_root: "."
  queue_file: "project-control/docs/work_intake/work_intake_queue.yaml"
  checkpoint_file: "project-control/tools/coord_runner/coord_state.json"
  poll_interval_seconds: 5.0
  default_lease_duration_seconds: 1800.0

work_intake:
  root_dir: "project-control/docs/work_intake"
  legacy_queue_file: "project-control/docs/planning/coord_autorun_queue_20261029.yaml"
  isolate_legacy_queue: true
  codex_bin: "/home/sushaohua/.local/bin/codex"
  default_model: "gpt-6-luna"
  jobs_dir: "project-control/tools/coord_runner/runtime_jobs"

limits:
  max_parallel_implementation: 2
  max_evidence_based_corrections: 2
  physical_operator_per_resource: 1

resources:
  exclusive_devices:
    - uart
    - hardware-serial
    - hil-device
    - probe

qa_integration:
  config_path: "project-control/config/qa_runner/default_config.yaml"
  enabled: true
