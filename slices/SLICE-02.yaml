revision: 1
batch_id: "BATCH-OTA-ACCEPTANCE-01"
profile: "host-software"
depends_on: ["SLICE-01"]
input_repositories: ["project-control", "agents", "test_harness", "printer-soc", "mcu-p3", "boot/bootloadermc", "boot/bootloaderth"]
title: "MC/TH Bootloader 与 App 宿主机 ARM 交叉编译尺寸门禁及双版本 ATSG 包兼容验证"
plan_ref: "project-control/docs/planning/mc_th_upgrade_acceptance_implementationplan_20261117_174500.md"
