  - "S08-MCU-FIX-01（方案 A）：wk_usart2_init 将 PA3(USART2_RX) 配为 GPIO_PULL_UP；memu_gui.c 与 minimc_proto.c 补齐 USART_ROERR_FLAG/FERR/NERR/BFF 全量清除与 DMA1_CHANNEL6 恢复；minimc_proto_init 切 921600 后与 main.c 进入 while(1) 前调用 minimc_proto_reset_rx_channel 清理初始化噪声；test_mc_ota_and_relay.c 覆盖错误清除与初始化恢复单测，宿主机 ARM make pack 产出已验证 fw_mc_r17.bin"
  - "r17 统一回归覆盖 06/07/08 全量宿主测试、C308L ARM 构建与隔离制镜（FILE_FILTER=Y, 0444 权限, UBIFS 复核）以及 mcu-p3 宿主测试，保持 boot/bootloadermc 与 boot/bootloaderth 零改动"
  - "四阶门禁（fast_gate <3s + integration_cmd + qa_runner + 独立 Codex 冷审 0 BLOCKER）通过并写 ledger SW-Verified 后，停在 Human Gate #2 申请 r17 实板刷写"

