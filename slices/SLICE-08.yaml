acceptance_criteria:
  - "S08-R18-MCU：wk_usart2_init 将 PA2(USART2_TX) 与 PA3(USART2_RX) 的 gpio_drive_strength 均设为 GPIO_DRIVE_STRENGTH_STRONGER (0x01) 对齐 bootloadermc 硅片实证参数，并以 AP_USART_BAUDRATE (921600U) 直接初始化 USART2；test_mc_ota_and_relay.c 校验 wk_usart2_init 后 PA2/PA3 odrv 位域等于 GPIO_DRIVE_STRENGTH_STRONGER，宿主机 ARM make pack 产出最终提交对应的 fw_mc_r18.bin"
  - "S08-R18-AP：ota_transfer.cpp 将 OTA_ENTER_BOOT_WAIT_US 调至 450000U，保持 Stage-2 wait_mode(rt, true) 首错锁存（严格保留 test_ota_e2e.py boot_timeout count((3,1))==4），并为 Stage-4 wait_mode(rt, false) 增加最多 8 轮有界非锁存超时重询（覆盖 MC ~2.0s 启动期，遇非超时错误或耗尽重试立即锁存 communication_error）；device_manager_service.cpp receive_maintenance 在维护态进出边沿分别调用 dev_state_enter_maintenance / dev_state_exit_maintenance(state, false) 并刷新发布快照，消除 UPGRADING_MAINTENANCE 残留；新增 delayed_app_boot 与 DM 维护态退出单测"
  - "r18 统一回归覆盖 06/07/08 全量宿主测试、C308L ARM 构建与隔离制镜（FILE_FILTER=Y, 0444 权限, UBIFS 复核）以及 mcu-p3 宿主测试，保持 boot/bootloadermc 与 boot/bootloaderth 零改动"
  - "四阶门禁（fast_gate <3s + integration_cmd + qa_runner + 独立 Codex 冷审 0 BLOCKER）通过并写 ledger SW-Verified 后，停在 Human Gate #2 申请 r18 实板收口验收"

eng_delivery_requirements:
  - "ENG-AP 仅限修改 printer-soc@main 的 4 个 r18 目标文件（切片累计 max_files <= 13），ENG-MCU 仅限修改 mcu-p3@feat/soc-debug 的 2 个 r18 目标文件（切片累计 max_files <= 6）；禁止修改 boot/*、test_harness、agents、project-control 与根仓。"
  - "所有新增/非受保护函数严格遵守 <=50 行、<=4 入参、全中文 docstring/逻辑注释、零伪状态垫片；各自先本地全通测试与 fast_gate 校验，执行 fetch/rebase/push 保持严格线性历史并向 COORD 回报最终 40 位提交 SHA。"
