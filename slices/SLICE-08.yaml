  cd printer-soc &&
  python3 -B -m unittest services/helixscreen/platform/c308l/tests/test_tools.py tests/packaging/test_product_package.py &&
  python3 -B -m unittest discover -s tests/integration -p test_release_product.py -v &&
  cd .. &&
  python3 -B test_harness/hil/tests/test_helix_screen_integration.py --self-test &&
  (cd mcu-p3/motion-controller-mcu/tests && sh run_tests.sh) &&
  python3 -c 'import pathlib, subprocess; log=pathlib.Path("project-control/docs/evidence/SLICE-08/host_mc_arm_build_and_pack_r18.log").read_text(encoding="utf-8"); head=subprocess.check_output(["git","-C","mcu-p3","rev-parse","HEAD"], text=True).strip(); assert f"MCU_P3_COMMIT={head}" in log and "[PASS] HOST_MC_ARM_BUILD_AND_PACK" in log, "host MC ARM build log mismatch"'

