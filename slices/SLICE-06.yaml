# V2 垂直切片 SLICE-06 (P0-A)：HelixScreen 原生 AISoC 接入、三端真实版本、生产裁剪与全/半断连冷启动自愈
slice_id: "SLICE-06"
revision: 1
batch_id: "BATCH-HELIX-P0-01"
profile: "host-software"
depends_on: ["SLICE-05"]
input_repositories: ["project-control", "agents", "test_harness", "printer-soc"]
title: "SLICE-06 (P0-A)：生产冷启动、AP/MC/TH 真实版本、急停与全/半断连恢复 + 生产裁剪验收"
plan_ref: "project-control/docs/planning/helix_screen_mc_th_integration_implementationplan_20261118_144741.md"
contract_ref: "project-control/contracts/minimc_v2_contract.yaml"
requires_hil_immediately: false

subtasks:
  - role: "ENG-AP"
    repo: "printer-soc"
    branch: "main"
    allowed_paths:
      - "contracts/twin/dbus_interfaces.xml"
      - "config/runtime/c308l/*"
      - "boards/c308l-aw419/rootfs-overlay/**"
      - "tools/build_c308l_services.py"
      - "tools/build_helixscreen_c308l.py"
      - "tools/package_helixscreen_c308l.py"
      - "tools/c308l_services.py"
      - "tools/package_c308l_product.py"
      - "services/forward/forward_main.cpp"
      - "services/forward/forward_service.cpp"
      - "services/forward/forward_types.h"
      - "services/forward/forward_ota.h"
      - "services/forward/forward_ota_guard.cpp"
      - "services/forward/forward_version.cpp"
      - "services/forward/forward_exchange.cpp"
      - "services/helixscreen/Makefile"
      - "services/helixscreen/mk/**"
      - "services/helixscreen/platform/c308l/**"
      - "services/helixscreen/include/*.h"
      - "services/helixscreen/include/aisoc/**"
      - "services/helixscreen/src/aisoc/**"
      - "services/helixscreen/src/application/application.cpp"
      - "services/helixscreen/src/application/panel_factory.cpp"
      - "services/helixscreen/src/xml_registration.cpp"
      - "services/helixscreen/src/ui/ui_settings_about.cpp"
      - "services/helixscreen/src/ui/ui_emergency_stop.cpp"
      - "services/helixscreen/src/ui/ui_overlay_network_settings.cpp"
