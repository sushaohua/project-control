      - "tests/forward/twin/**"
      - "tests/packaging/test_product_package.py"
    diff_budget:
      max_files: 36
      protected_globs:
        - "services/helixscreen/src/application/**"
        - "services/helixscreen/src/ui/**"
        - "services/helixscreen/src/xml_registration.cpp"
        - "services/helixscreen/include/*.h"
        - "services/helixscreen/Makefile"
        - "services/helixscreen/mk/**"
      max_protected_lines: 600

integration_cmd: >-
  python3 project-control/tools/gates/fast_gate.py --workspace . --slice project-control/slices/SLICE-06.yaml &&
  python3 project-control/tools/sync_contracts.py --workspace . &&
  python3 -m unittest discover -s printer-soc/services/helixscreen/platform/c308l/tests -p "test_*.py" -v &&
  python3 -m unittest discover -s printer-soc/tests/packaging -p "test_*.py" -v &&
  make -C printer-soc/services/helixscreen test-aisoc &&
  echo "[PASS] SLICE-06 integration checks finished"

qa_commands:
  - {subpath: "printer-soc", kind: "build", command: "cmake -S . -B /output/build_ps -DSOC_AP_BUILD_SERVICES=ON -DTHIRDPARTY_INSTALL_DIR=/usr/local && cmake --build /output/build_ps -j4"}
  - {subpath: "printer-soc", kind: "test", command: "ctest --test-dir /output/build_ps --output-on-failure && python3 tests/forward/startup/test_startup_fail_fast.py /workspace/printer-soc /output/build_ps/services/forward /usr/local && python3 -m unittest services/helixscreen/platform/c308l/tests/test_tools.py tests/packaging/test_product_package.py"}
  - {subpath: "printer-soc", kind: "test", command: "g++ -std=c++17 -O2 -Wall -Wextra -Iservices/helixscreen/include -Iservices/helixscreen/include/aisoc -Iservices/helixscreen/src/aisoc -Imiddleware/dbus/include -Imiddleware/dds/include -Icontracts/twin -I/usr/local/include/dbus-1.0 -I/usr/local/lib/dbus-1.0/include services/helixscreen/src/aisoc/*.cpp services/helixscreen/tests/unit/aisoc/test_aisoc_p0.cpp /output/build_ps/middleware/dbus/libaisoc_dbus.a /output/build_ps/middleware/dds/libaisoc_dds.so /usr/local/lib/libdbus-1.so -lpthread -Wl,-rpath,/output/build_ps/middleware/dds:/usr/local/lib -o /output/test_aisoc_p0 && /output/test_aisoc_p0 /usr/local/bin/dbus-daemon /usr/local/bin/dbus-send"}

acceptance_criteria:
  - "Forward 保留无 --allow-offline-start 原生 exit=2/3 fail-fast 契约；--allow-offline-start 下全断连及 MC 在线/TH 离线半断连均降级存活并发射 LinkStateChanged(false)，非写刷期放行只读 0x01 QueryVersion 并在恢复 App 后自愈，接回后 DM 500ms 轮询经 allow_open=true 自动重开串口恢复"
  - "HelixScreen 走进程内原生 AisocConnection（零 ui_gateway / --test / mock_demo），AboutSettingsOverlay 绑定 AP(/etc/printer-soc/version.json)+MC+TH 版本与 App/Boot 模式，EmergencyStop 明确区分 后台已锁定(BUSY) 与 设备已确认急停"
  - "按 DEC-SCREEN-05 从编译源码、页面注册及 C308L 打包清单三方验收首版 UI 与资源裁剪；cross.mk 切换为受控动态链接且 package_c308l_product.py 校验 NEEDed/RUNPATH 与 <=44MiB 包体"
  - "统一 S90printer-soc / c308l_services.py 支持非阻塞 start / stop / status / dev-mode 与串口/fb0 零残留互斥；contracts/twin/dbus_interfaces.xml 与服务实现同步；四阶门禁 + 独立 Codex 冷审 0 BLOCKER"

eng_delivery_requirements:
  - "1. 所有新增/非 protected_globs 文件（含 services/forward/**、services/helixscreen/{include,src}/aisoc/**、tools/*.py、platform/c308l/*.py）严格遵守单函数<=50行、入参<=4个、全中文 docstring 与逻辑块注释（修改 build_c308l_services.py/package_c308l_product.py 时须顺带拆分超50行存量函数以通过 fast_gate）。"
  - "2. 提交前必须在宿主机真实跑通：(a) tools/build_c308l_services.py --sdk ../sdk/c308l 与 build_helixscreen_c308l.py + package_c308l_product.py C308L 交叉编译打包（清理 /tmp 临时产物或仅留轻量自检，不向 git 仓留构建脏文件），验证 readelf -d RUNPATH=$ORIGIN 与 <=44MiB；(b) integration_cmd 全部项；(c) fast_gate.py --slice project-control/slices/SLICE-06.yaml 零报错。"
  - "3. 完成后执行 git -C printer-soc fetch origin main && rebase origin/main && push origin main 保持严格线性历史并确保远端 GitLab 可拉取 40 位 candidate_commit，同时写自检报告到 project-control/docs/evidence/SLICE-06/ENG-AP_selfcheck.md（不改动 slices/ledger.md 与未授权仓）。"
