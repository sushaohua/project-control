acceptance_criteria:
  - "UX-01 (S09-UX01)：刷入新候选前，INTEGRATOR 在 r18b 英文默认基线实板 (printer-soc@6f28023f) 从真实首页完成 CHK-01~CHK-06（版本、亮度、有线网络、升级入口发现性、打开页面、扫描固件与反馈），产出 UX01_WALKTHROUGH_REPORT.md 与截屏/日志证物并按 5 类标准如实归因卡点（业务仓 0 改动）"
  - "UX-02 (S09-AP)：printer-soc@main 将 live-profile.json 默认语言设为 \"zh\" 并含 c308l_default_lang_migrated=1，c308l_services.py 与 printer-soc-panel 实现首启 .helix-fresh-install 及存量 r18b \"en\" 配置（含 .helixscreen/settings.json.backup）一次性默认中文迁移且保留用户后续手动切回 \"en\" 的选择；cjk_font_manager.cpp 在 HELIX_ENABLE_AISOC 下保持 needs_cjk()==true 防切回英文卸载字库；settings_panel.xml 新增一级「本地固件升级 (MC/TH)」与「关于」页原入口 100% 复用同一 OtaLocalOverlay 单例；Forward 补齐单节点 scan_state/scan_error 与顶层 policy 且扫描不因单文件缺失短路；全量 AISoC 文案消除硬编码“验签通过”误导且通过 LVGL 字库 100% 字形覆盖校验；配套产出同源可扫描 fw_mc.bin 与 fw_th.bin"
  - "TH-ESTOP-01 (S09-MCU)：mcu-p3@feat/soc-debug 修复 color-engine-mcu handle_th_motion_stop()，单播 0x17 锁存(0x01)与解除(0x00)均返回标准 18B (4B CMD_ACK)，解除(0x00)不触发 quickStop/清零目标温度/入队 M112，stop_mode>1 回 NACK 0x03，广播不回 ACK；test_twin45_th_debug 与 test_th_ota_and_bootid 双套件正负用例全绿"
  - "BOOT-MC-STAY-01 (S09-BOOT-MC)：boot/bootloadermc@soc_debug（严禁写 main）移除 handle_cmd_get_version() 中误置的 s_ota.stay_in_boot = 1U，确保普通只读 0x01/0x03 轮询下正常回复版本且 2.0s 窗口后自动跳 App，同时完整保留 UPG2 魔数、0x1D(action=2) 与 0x20 显式驻留及正常串口 OTA 恢复路径；交叉编译 <=128KB、零 USART6 耦合与单测全绿"
  - "单候选四阶门禁（fast_gate <3s + integration_cmd + qa_runner c308l-system + Codex gpt-6.2-astra High 双轴冷审 0 BLOCKER）通过并登记 SW-Verified 后，按 Human Gate #2A（常规上板与触屏 OTA/急停）与独立 Human Gate #2B（MC Bootloader SWD 0x08000000 写刷）分闸执行真机验收，四项分别汇报结果、远端 40 位 SHA 与证据路径，缺测项诚实保留待验证"

