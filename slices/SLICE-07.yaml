# V2 垂直切片 SLICE-07 (P0-B)：固定目录 MC/TH 本地 OTA、ECDSA-P256 写刷前验签与并发/互斥/急停软件联调
slice_id: "SLICE-07"
revision: 1
batch_id: "BATCH-HELIX-P0-01"
profile: "host-software"
depends_on: ["SLICE-06"]
input_repositories: ["project-control", "agents", "test_harness", "printer-soc"]
title: "SLICE-07 (P0-B)：固定目录 OTA + Forward ECDSA-P256 写刷前验签 + 并发/互斥/急停联调"
plan_ref: "project-control/docs/planning/helix_screen_mc_th_integration_implementationplan_20261118_144741.md"
contract_ref: "project-control/contracts/minimc_v2_contract.yaml"
requires_hil_immediately: false

subtasks:
  - role: "ENG-AP"
    repo: "printer-soc"
    branch: "main"
    allowed_paths:
      - "tools/build_c308l_services.py"
      - "tools/package_c308l_product.py"
      - "tools/sign_mcu_firmware.py"
      - "boards/c308l-aw419/rootfs-overlay/etc/printer-soc/fw_signing_pub.pem"
      - "core/firmware/CMakeLists.txt"
      - "core/firmware/firmware_hash.h"
      - "core/firmware/firmware_hash.cpp"
      - "services/forward/modules/ota/CMakeLists.txt"
      - "services/forward/modules/ota/ota_image.cpp"
      - "services/forward/forward_ota.cpp"
      - "services/device_manager/firmware_updater.cpp"
      - "services/helixscreen/include/aisoc/**"
      - "services/helixscreen/src/aisoc/**"
      - "services/helixscreen/include/ui_settings_ota.h"
      - "services/helixscreen/src/ui/ui_settings_ota.cpp"
      - "services/helixscreen/ui_xml/ota_local_overlay.xml"
      - "services/helixscreen/tests/unit/**"
      - "tests/ota/**"
      - "tests/device_manager/twin/test_firmware_updater.cpp"
    diff_budget:
      max_files: 20
      protected_globs:
        - "services/helixscreen/src/ui/**"
        - "services/helixscreen/include/ui_*.h"
      max_protected_lines: 400

integration_cmd: >-
  python3 project-control/tools/gates/fast_gate.py --workspace . --slice project-control/slices/SLICE-07.yaml &&
  python3 project-control/tools/sync_contracts.py --workspace . &&
  make -C printer-soc/services/helixscreen test-aisoc &&
  echo "[PASS] SLICE-07 integration checks finished"

qa_commands:
  - {subpath: "printer-soc", kind: "build", command: "cmake -S . -B /output/build_ps -DSOC_AP_BUILD_SERVICES=ON -DTHIRDPARTY_INSTALL_DIR=/usr/local && cmake --build /output/build_ps -j4"}
  - {subpath: "printer-soc", kind: "test", command: "ctest --test-dir /output/build_ps --output-on-failure && python3 tests/ota/test_ota_e2e.py /workspace/printer-soc /output/build_ps /usr/local"}

acceptance_criteria:
  - "DEC-SCREEN-02=B：首版仅从固定固件目录扫描 fw_mc.bin / fw_th.bin（不含 TF 卡或 U 盘导入）"
  - "DEC-SCREEN-08=B：sign_mcu_firmware.py 与 ota_image.cpp:verify_image() 统一覆盖 trailer[0..52] ECDSA-P256 签名，覆盖合法签名包/未签名包/坏签名/缺失公钥 4 类验收，未通过返回 PACKAGE_SIGNATURE_INVALID 且 0 帧 0x1D/0x20；文档继续注明 MC FAT32 U 盘救援无 ECDSA 校验边界"
  - "DEC-SCREEN-03 有条件 A：补齐并发 OTA、维护互斥与急停联动验收，UI 明确区分 后台已锁定(BUSY) 与 设备已确认急停"

eng_delivery_requirements:
  - "1. 所有新增/非 protected_globs 文件（含 core/firmware/**、services/forward/**、services/device_manager/firmware_updater.cpp、services/helixscreen/{include,src}/aisoc/**、tools/*.py）严格遵守单函数<=50行、入参<=4个、全中文注释。"
  - "2. 签发端 tools/sign_mcu_firmware.py 与验签端 ota_image.cpp / firmware_updater.cpp 统一 ECDSA-P256 对 trailer[0..52] 签名覆盖范围，并在 CMake(qa-sandbox -lcrypto) 与 C308L ARM(sdk openssl-1.1.1f libcrypto.a) 双端编通。"
  - "3. 完成后执行 git -C printer-soc fetch origin main && rebase origin/main && push origin main 保持线性历史确保 GitLab 可检出 40 位 candidate_commit，写自检报告到 project-control/docs/evidence/SLICE-07/ENG-AP_selfcheck.md。"
