# V2 垂直切片 SLICE-05：纯串口真机 HIL 全闭环验收、HIL-FINDING-01 消缺与双板恢复
slice_id: "SLICE-05"
revision: 1
batch_id: "BATCH-OTA-ACCEPTANCE-01"
profile: "host-software"
depends_on: ["SLICE-01", "SLICE-02", "SLICE-04"]
input_repositories: ["project-control", "agents", "test_harness", "printer-soc", "mcu-p3", "boot/bootloadermc", "boot/bootloaderth"]
title: "C308L (/dev/ttyS1 @ 921600) 纯串口全闭环 HIL 验收：L3 透传消缺、无等待 TH->MC 衔接与 0x10 恢复"
plan_ref: "project-control/docs/planning/mc_th_upgrade_acceptance_implementationplan_20261117_174500.md"
contract_ref: "project-control/contracts/minimc_v2_contract.yaml"
requires_hil_immediately: true

subtasks: []

integration_cmd: >-
  python3 -c 'import subprocess; repos=["mcu-p3","printer-soc","test_harness","boot/bootloadermc","boot/bootloaderth","agents"]; dirty=[r for r in repos if subprocess.check_output(["git","-C",r,"status","--porcelain"],text=True).strip()]; assert not dirty, dirty; print("[PASS] 6 non-control repos strictly clean (0 diffs)")' &&
  python3 -c 'import subprocess, time; t0=time.monotonic(); r=subprocess.run(["python3", "project-control/tools/gates/fast_gate.py", "--workspace", ".", "--slice", "project-control/slices/SLICE-05.yaml"], capture_output=True, text=True); dt=time.monotonic()-t0; print((r.stdout + r.stderr).strip()); print(f"[PASS] fast_gate rc={r.returncode} elapsed_sec={dt:.3f} (<3.000s)"); assert r.returncode == 0 and dt < 3.0' &&
  python3 -c 'import hashlib, json, pathlib, re, struct, zlib;
  p = pathlib.Path("project-control/docs/evidence/SLICE-05");
  req = ["ttyS1_hw_provenance.log", "hil_raw_hex.log", "hil_deployment_receipt.json", "INTEGRATOR_hil_report.md"];
  assert all((p / f).is_file() and (p / f).stat().st_size > 0 for f in req);
  rec = json.loads((p / "hil_deployment_receipt.json").read_text(encoding="utf-8"));
  assert rec.get("passed") is True and rec.get("port") == "/dev/ttyS1" and rec.get("baud") == 921600;
  assert rec.get("probe_rs_used") is False and rec.get("heating_pwm_pct") == 0;
  prov = rec.get("hw_provenance", {});
  assert prov.get("irq_after", 0) - prov.get("irq_before", 0) > 100 and "/dev/ttyS1" in prov.get("tty_device", "") and "pty" not in prov.get("tty_sysfs_device", "").lower();
  raw_bytes = (p / "hil_raw_hex.log").read_bytes();
  assert hashlib.sha256(raw_bytes).hexdigest() == rec["raw_hex_log"]["sha256"];
  raw = raw_bytes.decode("utf-8");
  st = rec["stages"];
  assert all(st[k].get("passed") is True for k in ("B1", "B0_MC_ROLLOUT", "B3_TH", "B4_TH", "B2_TH", "immediate_th_to_mc_transition", "B3_MC", "B4_MC", "B2_MC", "post_upgrade_recovery"));
  assert st["immediate_th_to_mc_transition"]["elapsed_since_th_sec"] < 1.0 and st["immediate_th_to_mc_transition"]["boot_entry_elapsed_sec"] < 2.0;
  assert st["B4_TH"]["abort_0x24_active_lease"]["src_id"] == 3 and st["B4_TH"]["abort_0x24_active_lease"]["err_hex"] == "0x04";
  assert st["post_upgrade_recovery"]["quiet_wait_sec"] >= 5.2 and st["post_upgrade_recovery"]["spurious_nack_count"] == 0;
  tx_th = [bytes.fromhex(m.group(1)) for m in re.finditer(r"\[B2_TH\][^\n]*\bTX\s+([0-9a-fA-F]+)", raw)];
  tx_mc = [bytes.fromhex(m.group(1)) for m in re.finditer(r"\[B2_MC\][^\n]*\bTX\s+([0-9a-fA-F]+)", raw)];
  d_th = {struct.unpack("<I", b[12:16])[0]: b[20:20 + struct.unpack("<H", b[16:18])[0]] for b in tx_th if len(b) >= 22 and b[0] == 0x55 and b[1] == 0xAA and b[5] == 0x21};
  d_mc = {struct.unpack("<I", b[12:16])[0]: b[20:20 + struct.unpack("<H", b[16:18])[0]] for b in tx_mc if len(b) >= 22 and b[0] == 0x55 and b[1] == 0xAA and b[5] == 0x21};
  th_pay = b"".join(d_th[k] for k in sorted(d_th));
  mc_pay = b"".join(d_mc[k] for k in sorted(d_mc));
  assert len(d_th) == 151 and len(th_pay) == 76864 and (zlib.crc32(th_pay) & 0xFFFFFFFF) == 0x6E82DD49;
  assert len(d_mc) == 751 and len(mc_pay) == 384112 and (zlib.crc32(mc_pay) & 0xFFFFFFFF) == 0x8DC0DC33;
  assert hashlib.sha256(th_pay).hexdigest() == rec["packages"]["th"]["payload_sha256"] and th_pay.count(bytes.fromhex("9a3d627b")) >= 1;
  assert hashlib.sha256(mc_pay).hexdigest() == rec["packages"]["mc"]["payload_sha256"] and mc_pay.count(bytes.fromhex("9a3d627b")) >= 1;
  rep = (p / "INTEGRATOR_hil_report.md").read_text(encoding="utf-8");
  assert "DEC-REM-1" in rep and "HIL-FINDING-02" in rep and "[UNVERIFIED / PENDING]" in rep;
  print("[PASS] SLICE-05 HIL receipt, IRQ provenance delta & wire-chunk SHA256/CRC32/0x7B623D9A verified")'

qa_commands:
  - {subpath: "test_harness", kind: "test", command: "python3 hil/tools/hil_deploy_via_minimc_ota.py --self-test && python3 -m unittest discover -s hil/tests -p test_mcu_firmware_upgrade.py"}
  - {subpath: "project-control", kind: "test", command: "python3 -c 'import hashlib, json, pathlib, re, struct, zlib; p = pathlib.Path(\"docs/evidence/SLICE-05\"); rec = json.loads((p / \"hil_deployment_receipt.json\").read_text(encoding=\"utf-8\")); raw_bytes = (p / \"hil_raw_hex.log\").read_bytes(); raw = raw_bytes.decode(\"utf-8\"); prov = rec[\"hw_provenance\"]; st = rec[\"stages\"]; assert rec[\"passed\"] is True and rec[\"probe_rs_used\"] is False and rec[\"heating_pwm_pct\"] == 0 and prov[\"irq_after\"] - prov[\"irq_before\"] > 100 and hashlib.sha256(raw_bytes).hexdigest() == rec[\"raw_hex_log\"][\"sha256\"]; tx_th = [bytes.fromhex(m.group(1)) for m in re.finditer(r\"\\[B2_TH\\][^\\n]*\\bTX\\s+([0-9a-fA-F]+)\", raw)]; tx_mc = [bytes.fromhex(m.group(1)) for m in re.finditer(r\"\\[B2_MC\\][^\\n]*\\bTX\\s+([0-9a-fA-F]+)\", raw)]; d_th = {struct.unpack(\"<I\", b[12:16])[0]: b[20:20 + struct.unpack(\"<H\", b[16:18])[0]] for b in tx_th if len(b) >= 22 and b[0] == 0x55 and b[1] == 0xAA and b[5] == 0x21}; d_mc = {struct.unpack(\"<I\", b[12:16])[0]: b[20:20 + struct.unpack(\"<H\", b[16:18])[0]] for b in tx_mc if len(b) >= 22 and b[0] == 0x55 and b[1] == 0xAA and b[5] == 0x21}; th_pay = b\"\".join(d_th[k] for k in sorted(d_th)); mc_pay = b\"\".join(d_mc[k] for k in sorted(d_mc)); assert len(d_th) == 151 and (zlib.crc32(th_pay) & 0xFFFFFFFF) == 0x6E82DD49 and hashlib.sha256(th_pay).hexdigest() == rec[\"packages\"][\"th\"][\"payload_sha256\"]; assert len(d_mc) == 751 and (zlib.crc32(mc_pay) & 0xFFFFFFFF) == 0x8DC0DC33 and hashlib.sha256(mc_pay).hexdigest() == rec[\"packages\"][\"mc\"][\"payload_sha256\"]; assert st[\"B4_TH\"][\"abort_0x24_active_lease\"][\"src_id\"] == 3 and st[\"B4_TH\"][\"abort_0x24_active_lease\"][\"err_hex\"] == \"0x04\" and st[\"immediate_th_to_mc_transition\"][\"elapsed_since_th_sec\"] < 1.0 and st[\"post_upgrade_recovery\"][\"spurious_nack_count\"] == 0; print(\"[PASS] Docker QA verified SLICE-05 provenance, receipt & 0x21 payload hashes\")'"}

acceptance_criteria:
  - "真机硬件与防伪溯源：C308L (root@192.168.1.101:/dev/ttyS1 @ 921600 8N1 raw termios) 全程禁用 probe-rs/SWD (probe_rs_used=false) 且 Option A 加热 0%；ttyS1_hw_provenance.log 实证 /sys/class/tty/ttyS1/device 物理绑定及 UART 中断计数差值 (>100)，hil_raw_hex.log 重组 151 块 TH 与 751 块 MC 0x21 载荷与 0x7B623D9A 固件 SHA256/CRC32 一致"
  - "HIL-FINDING-01 消缺验证 (B4_TH)：MC 与 TH 运行 mcu-p3@7b623d9a (0x7B623D9A)（见 INTEGRATOR_hil_report.md §2.1 初始 0xB865222C->0x7B623D9A 灰度升级及归档单次全闭环 B0_MC_ROLLOUT 751 块重刷记录），在 L3 5000ms 活跃租约期内发 DST=0x03 CMD=0x24 必须收到 SRC=0x03 NACK 0x04（零 SRC=0x02 NACK 0x05），4B 0x23 回 SRC=0x03 NACK 0x06，0x01/0x03/0x14 双向透传与 DST=0x02 0x01/0x03/0x14 查询零阻塞、0x10 本地级联让路回 NACK 0x05、0x1D(1) 驻留 TH Boot 刷新 boot_id"
  - "无等待跨板衔接与全量升级 (B2_TH -> <1.0s -> B2_MC)：B2_TH (151 块) 升至 TH 0x7B623D9A 并刷新 boot_id 后不等待 5s 租约，在 <1.0s 内直发 DST=0x02 0x1D(2) 立即收到 SRC=0x02 CMD_ACK 并在 <2.0s 进 MC Boot；随后 B3_MC/B4_MC/B2_MC (751 块) 将 MC 刷至 0x7B623D9A 并刷新 boot_id（按用户已批准豁免政策将 MC Boot boot_id=0xC1E6CD05 复现记为 HIL-FINDING-02 非阻断已接受技术债，未实测的硬件寄存器行为诚实标为 [UNVERIFIED]）"
  - "租约释放与平面 B 恢复：静默 >=5.2s 等待 L3 租约释放后发送 DST=0x02 CMD=0x10 (0, 0) 安全级联（0% PWM）收到 SRC=0x02 CMD_ACK/0x15 TEMP_REPORT，350ms 监听无 USART2 幽灵 NACK 0x03"
  - "审批与非阻断诚实边界 (DEC-REM-1=A)：按 v1.5 已批准 DEC-REM-1=A 条件准出范围，物理 FAT32 U 盘插拔 (B5) 与外接独立 Debug UART 诚实标为 [UNVERIFIED / PENDING] 且非阻塞，结合 fast_gate (<3s) 与独立 Codex 双轴 APPROVED 升级 ledger.md 至 HIL-Verified"
