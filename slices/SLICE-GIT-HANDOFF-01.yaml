# V2 纵向治理切片 SLICE-GIT-HANDOFF-01：全流程 Git 服务端交接、资源节约与 Helix 统一准出改造
slice_id: "SLICE-GIT-HANDOFF-01"
revision: 1
batch_id: "BATCH-GIT-HANDOFF-01"
profile: "host-software"
delivery_kind: "deliverable"
input_repositories: ["project-control", "agents", "printer-soc", "test_harness"]
title: "SLICE-GIT-HANDOFF-01：GitLab 服务端交接协议、检查点/交付点巡航、按 run 清理与实测阻塞记录"
plan_ref: "project-control/docs/planning/git_server_handoff_implementationplan_20261120_093936.md"
contract_ref: "project-control/contracts/git_handoff.schema.json"
requires_hil_immediately: false

# GH-01~GH-05 单机能力及 GH-04 发布复核已实现；跨机共享存储与 QA 镜像远端拉取保持 PENDING，第 1 项 DEFERRED。
subtasks:
  - role: "ENG-AP"
    repo: "printer-soc"
    branch: "main"
    allowed_paths:
      - "tools/release_product.py"
      - "tests/integration/test_release_product.py"
    diff_budget: {max_files: 4, protected_globs: [], max_protected_lines: 0}

integration_cmd: >-
  python3 -B project-control/tools/gates/fast_gate.py --workspace . --files
  printer-soc/tools/release_product.py
  printer-soc/tests/integration/test_release_product.py
  project-control/tools/workflow/git_handoff.py
  project-control/tools/workflow/run_slice_batch.py
  project-control/tools/gates/slice_gate.py
  project-control/tools/qa_runner/qa_runner.py
  project-control/tools/test_v2_gates.py
  project-control/tools/test_qa_runner.py &&
  python3 -B -m unittest discover -s tools -p "test_workspace.py" -v &&
  python3 -B -m unittest discover -s project-control/tools -p "test_v2_gates.py" -v &&
  python3 -B -m unittest discover -s project-control/tools -p "test_qa_runner.py" -v &&
  python3 -B -m unittest discover -s printer-soc/tests/integration -p "test_release_product.py" -v &&
  python3 -B test_harness/hil/tests/test_helix_screen_integration.py --self-test

qa_commands:
  - {subpath: "project-control", kind: "test", command: "python3 -B -m unittest discover -s tools -p 'test_v2_gates.py' -v && python3 -B -m unittest discover -s tools -p 'test_qa_runner.py' -v"}
  - {subpath: "printer-soc", kind: "test", command: "python3 -B -m unittest discover -s tests/integration -p 'test_release_product.py' -v"}
  - {subpath: "test_harness", kind: "test", command: "python3 -B hil/tests/test_helix_screen_integration.py --self-test"}

acceptance_criteria:
  - "GH-01：空工作区 SSH 克隆、56 个 SDK 项目锁定提交匹配及远端 tip 可达实测完成；printer-soc/.gitignore 已修复并验证"
  - "GH-02：git_handoff.schema.json、git_handoff.py (prepare_handoff/verify_handoff)、checkpoint/deliverable 巡航与同输入 QA 复用通过 test_v2_gates.py 及断链负例"
  - "GH-03：qa_runner.py 支持精确根仓检出、相对路径规范化证据与按 run 安全清理并通过 test_qa_runner.py"
  - "GH-04/GH-05：UBIFS 提取器经独立 QA 验证且 release_product.py 深检/--handoff/06-07-08 覆盖门禁通过单测；单机 GitLab 读回、GH-05 回收与单机隔离取件通过，跨机共享存储与 QA 镜像远端拉取保持 PENDING，第 1 项保持 DEFERRED"
